services:
  postgres:
    image: postgres:17-alpine
    container_name: car-sale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carsale
      POSTGRES_PASSWORD: carsale
      POSTGRES_DB: carsale
    ports:
      - '56432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
