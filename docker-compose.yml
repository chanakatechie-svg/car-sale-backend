# Optional: a containerised MySQL if you don't have one installed locally.
# Uses host port 53306 so it doesn't clash with a local MySQL on 3306
# (set DB_PORT=53306 in .env if you use this).
services:
  mysql:
    image: mysql:8.4
    container_name: car-sale-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: carsale
      MYSQL_USER: carsale
      MYSQL_PASSWORD: carsale
      MYSQL_DATABASE: carsale
    ports:
      - '53306:3306'
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
